<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Animated 3D GitHub Contribution Planet">
<title>GitHub Contribution Planet — fuwad7</title>
<defs>
  <radialGradient id="space" cx="50%" cy="42%" r="78%">
    <stop offset="0%" stop-color="#131f47"/><stop offset="40%" stop-color="#0a0f2b"/><stop offset="100%" stop-color="#030611"/>
  </radialGradient>
  <radialGradient id="body" cx="33%" cy="27%" r="80%">
    <stop offset="0%" stop-color="#c9fbff"/><stop offset="14%" stop-color="#4ee6ff"/><stop offset="38%" stop-color="#00b3e6"/>
    <stop offset="62%" stop-color="#3a5fc0"/><stop offset="84%" stop-color="#4b2591"/><stop offset="100%" stop-color="#150a30"/>
  </radialGradient>
  <radialGradient id="night" cx="74%" cy="76%" r="66%">
    <stop offset="0%" stop-color="#02040c" stop-opacity=".96"/><stop offset="45%" stop-color="#02040c" stop-opacity=".62"/>
    <stop offset="100%" stop-color="#02040c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#00d9ff" stop-opacity="0"/><stop offset="88%" stop-color="#00d9ff" stop-opacity=".38"/>
    <stop offset="96%" stop-color="#a855f7" stop-opacity=".28"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonG" cx="32%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#ffd6f2"/><stop offset="100%" stop-color="#a855f7"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/><stop offset="18%" stop-color="#00d9ff" stop-opacity=".85"/>
    <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/><stop offset="82%" stop-color="#ff2d95" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="70%" stop-color="#8ef7ff" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#030611" stop-opacity=".9"/><stop offset="20%" stop-color="#030611" stop-opacity="0"/>
    <stop offset="80%" stop-color="#030611" stop-opacity="0"/><stop offset="100%" stop-color="#030611" stop-opacity=".9"/>
  </linearGradient>
  <!-- Filters: GitHub strips these, but they enhance the SVG when viewed directly -->
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blurL" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="46"/></filter>

  <clipPath id="planetClip"><circle cx="600" cy="316" r="170"/></clipPath>
  <clipPath id="frontClip"><rect x="0" y="316" width="1200" height="284"/></clipPath>

  <!-- one 234px-wide tile of contribution bars, repeated to fake surface rotation -->
  <g id="tile">
    <rect x="0"   y="394" width="15" height="30" rx="3" fill="#16437a" opacity=".85"/>
    <rect x="26"  y="370" width="15" height="54" rx="3" fill="#0e7490" opacity=".8"/>
    <rect x="52"  y="384" width="15" height="40" rx="3" fill="#00d9ff" opacity=".75"/>
    <rect x="78"  y="358" width="15" height="66" rx="3" fill="#a855f7" opacity=".8"/>
    <rect x="104" y="398" width="15" height="26" rx="3" fill="#ff2d95" opacity=".7"/>
    <rect x="130" y="376" width="15" height="48" rx="3" fill="#16437a" opacity=".85"/>
    <rect x="156" y="364" width="15" height="60" rx="3" fill="#00d9ff" opacity=".8"/>
    <rect x="182" y="390" width="15" height="34" rx="3" fill="#0e7490" opacity=".75"/>
    <rect x="208" y="380" width="15" height="44" rx="3" fill="#a855f7" opacity=".8"/>
  </g>
</defs>

<!-- ── SPACE ───────────────────────────────────────────── -->
<rect width="1200" height="600" fill="url(#space)"/>
<!-- Nebula clouds: no filter ref so they show as solid color blobs on GitHub (still pretty) -->
<g opacity=".18">
  <ellipse cx="250" cy="180" rx="230" ry="120" fill="#a855f7" opacity=".22">
    <animate attributeName="opacity" values=".14;.3;.14" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="980" cy="430" rx="250" ry="130" fill="#00d9ff" opacity=".16">
    <animate attributeName="opacity" values=".1;.24;.1" dur="17s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="880" cy="120" rx="170" ry="90" fill="#ff2d95" opacity=".13">
    <animate attributeName="opacity" values=".07;.2;.07" dur="21s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- ── STARFIELD ───────────────────────────────────────── -->
<g fill="#ffffff">
  <circle cx="90" cy="90" r="1.6" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="240" r="1.2" opacity=".6"><animate attributeName="opacity" values=".1;.9;.1" dur="4.4s" begin="-1s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="110" r="1.8" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" begin="-.6s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="60" r="1.1" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="5.2s" begin="-2s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="120" r="1.5" opacity=".7"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="70" r="1.2" opacity=".6"><animate attributeName="opacity" values=".1;.9;.1" dur="4.9s" begin="-.9s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="190" r="1.7" opacity=".85"><animate attributeName="opacity" values=".25;1;.25" dur="3.3s" begin="-2.2s" repeatCount="indefinite"/></circle>
  <circle cx="940" cy="90" r="1.3" opacity=".6"><animate attributeName="opacity" values=".15;.85;.15" dur="4.1s" begin="-.3s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="160" r="1.9" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" begin="-1.7s" repeatCount="indefinite"/></circle>
  <circle cx="1150" cy="300" r="1.2" opacity=".55"><animate attributeName="opacity" values=".1;.8;.1" dur="5.5s" begin="-2.6s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="400" r="1.6" opacity=".75"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin="-.8s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="500" r="1.3" opacity=".6"><animate attributeName="opacity" values=".15;.9;.15" dur="4.7s" begin="-1.9s" repeatCount="indefinite"/></circle>
  <circle cx="290" cy="520" r="1.7" opacity=".8"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="560" r="1.1" opacity=".5"><animate attributeName="opacity" values=".1;.75;.1" dur="5.8s" begin="-1.1s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="540" r="1.5" opacity=".7"><animate attributeName="opacity" values=".2;.95;.2" dur="4.2s" begin="-.4s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="560" r="1.2" opacity=".55"><animate attributeName="opacity" values=".15;.85;.15" dur="5.1s" begin="-2.9s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="500" r="1.8" opacity=".85"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" begin="-1.3s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="440" r="1.3" opacity=".6"><animate attributeName="opacity" values=".1;.9;.1" dur="4.6s" begin="-.7s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="330" r="1.1" opacity=".45"><animate attributeName="opacity" values=".1;.7;.1" dur="6.1s" begin="-3.1s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="330" r="1.1" opacity=".45"><animate attributeName="opacity" values=".1;.7;.1" dur="5.9s" begin="-2.1s" repeatCount="indefinite"/></circle>
</g>

<!-- ── SHOOTING STAR (static position for GitHub, animated elsewhere) ── -->
<g>
  <g opacity=".7" transform="translate(350,140)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.12;.28;.42;1" dur="8s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-110" y2="52" stroke="url(#shoot)" stroke-width="2.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="180,60;520,220;520,220" keyTimes="0;.42;1" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g opacity=".5" transform="translate(950,145)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.5;.62;.76;1" dur="11s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-96" y2="40" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="1080,90;820,200;820,200" keyTimes="0;.76;1" dur="11s" repeatCount="indefinite"/>
    </line>
  </g>
</g>

<!-- ── OUTER HUD ORBIT RINGS ───────────────────────────── -->
<g fill="none" stroke-linecap="round">
  <circle cx="600" cy="316" r="252" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 14" opacity=".3">
    <animateTransform attributeName="transform" type="rotate" from="0 600 316" to="360 600 316" dur="70s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="316" r="276" stroke="#00d9ff" stroke-width="1" stroke-dasharray="40 22" opacity=".18">
    <animateTransform attributeName="transform" type="rotate" from="360 600 316" to="0 600 316" dur="95s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ── RING (BACK HALF) ────────────────────────────────── -->
<g transform="rotate(-16 600 316)">
  <ellipse cx="600" cy="316" rx="304" ry="80" fill="none" stroke="url(#ring)" stroke-width="11" opacity=".8"/>
  <ellipse cx="600" cy="316" rx="304" ry="80" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 16" opacity=".45">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="316" rx="342" ry="90" fill="none" stroke="#ff2d95" stroke-width="2" stroke-dasharray="44 28" opacity=".3">
    <animate attributeName="stroke-dashoffset" from="0" to="144" dur="9s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- ── PLANET ──────────────────────────────────────────── -->
<g>
  <circle cx="600" cy="316" r="170" fill="url(#body)"/>
  <g clip-path="url(#planetClip)">
    <!-- scrolling contribution surface -->
    <g transform="rotate(-10 600 316)" opacity=".55">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-234 0" dur="18s" repeatCount="indefinite"/>
        <use href="#tile" x="366"/><use href="#tile" x="600"/><use href="#tile" x="834"/><use href="#tile" x="1068"/>
      </g>
    </g>
    <!-- parallax cloud bands -->
    <g transform="rotate(-10 600 316)" opacity=".16" fill="#ffffff">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="34s" repeatCount="indefinite"/>
        <ellipse cx="620" cy="252" rx="180" ry="14"/><ellipse cx="920" cy="252" rx="180" ry="14"/>
        <ellipse cx="560" cy="392" rx="200" ry="16"/><ellipse cx="860" cy="392" rx="200" ry="16"/>
      </g>
    </g>
    <!-- parallels (static) -->
    <g fill="none" stroke="#8ef7ff" stroke-width="1" opacity=".16">
      <ellipse cx="600" cy="196" rx="118" ry="14"/><ellipse cx="600" cy="256" rx="157" ry="19"/>
      <ellipse cx="600" cy="316" rx="168" ry="20"/><ellipse cx="600" cy="376" rx="157" ry="19"/>
      <ellipse cx="600" cy="436" rx="118" ry="14"/>
    </g>
    <!-- meridians (sweeping = rotation) -->
    <g fill="none" stroke="#00d9ff" stroke-width="1.1" opacity=".3">
      <ellipse cx="600" cy="316" rx="80" ry="170"/>
      <ellipse cx="600" cy="316" rx="140" ry="170"/>
      <ellipse cx="600" cy="316" rx="168" ry="170"><animate attributeName="rx" values="168;0;168" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="600" cy="316" rx="40" ry="170"><animate attributeName="rx" values="168;0;168" dur="14s" begin="-3.5s" repeatCount="indefinite"/></ellipse>
    </g>
    <!-- night side -->
    <circle cx="600" cy="316" r="170" fill="url(#night)"/>
  </g>
  <!-- atmosphere -->
  <circle cx="600" cy="316" r="188" fill="url(#atmo)"/>
  <circle cx="600" cy="316" r="171" fill="none" stroke="#8ef7ff" stroke-width="1.6" opacity=".5">
