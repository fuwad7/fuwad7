  <circle cx="600" cy="316" r="180" fill="none" stroke="#a855f7" stroke-width="6" opacity=".15">
    <animate attributeName="r" values="170;196;170" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0;.35" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ── RING (FRONT HALF) ───────────────────────────────── -->
<g clip-path="url(#frontClip)">
  <g transform="rotate(-16 600 316)">
    <ellipse cx="600" cy="316" rx="304" ry="80" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".95"/>
    <ellipse cx="600" cy="316" rx="304" ry="80" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 16" opacity=".5">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</g>

<!-- ── ORBITERS (positioned statically for GitHub, animated elsewhere) ── -->
<g transform="rotate(-16 600 316)">
  <circle cx="930" cy="316" r="5.5" fill="#ff2d95">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 270,316 a 330,86 0 1,0 660,0 a 330,86 0 1,0 -660,0"/>
  </circle>
</g>
<g transform="rotate(22 600 316)">
  <g transform="translate(210,316)">
    <animateMotion dur="21s" repeatCount="indefinite" path="M 210,316 a 390,120 0 1,0 780,0 a 390,120 0 1,0 -780,0"/>
    <circle r="13" fill="url(#moonG)"/>
    <circle r="19" fill="none" stroke="#a855f7" stroke-width="1" opacity=".3">
      <animate attributeName="r" values="15;24;15" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- ── VIGNETTE ────────────────────────────────────────── -->
<rect width="1200" height="600" fill="url(#vig)"/>

<!-- ── HUD ─────────────────────────────────────────────── -->
<g font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
