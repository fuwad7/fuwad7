      </rect>
      <text x="0" y="5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.6" fill="#ffffff">⬢ ENTER 360° ORBIT ↗</text>
    </g>
  </g>

  <text x="600" y="556" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#00d9ff">864 COMMITS  ·  32-DAY STREAK  ·  18 MAX/DAY  ·  365-DAY CYCLE</text>
  <text x="46" y="584" font-size="9.5" letter-spacing="1.6" fill="#8892b0">DRAG ▸ ROTATE   SCROLL ▸ ZOOM   CLICK ▸ DAY TELEMETRY</text>
  <text x="1154" y="584" text-anchor="end" font-size="9.5" letter-spacing="1.6" fill="#8892b0">v2.5 · fuwad7.github.io/planet</text>
</g>
</svg>