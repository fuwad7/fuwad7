  </rect>

  <g fill="none" stroke="#00d9ff" stroke-width="2" opacity=".55">
    <path d="M 26,66 L 26,26 L 66,26"/><path d="M 1134,26 L 1174,26 L 1174,66"/>
    <path d="M 26,534 L 26,574 L 66,574"/><path d="M 1134,574 L 1174,574 L 1174,534"/>
  </g>

  <text x="46" y="52" font-size="11" font-weight="700" letter-spacing="2.4" fill="#00d9ff">SYSTEM.STATUS // ONLINE</text>
  <text x="46" y="72" font-size="10" letter-spacing="1.6" fill="#8892b0">TARGET: fuwad7 · ORBITAL DATA CORE</text>
  <text x="1154" y="52" text-anchor="end" font-size="11" font-weight="700" letter-spacing="2.4" fill="#ff2d95">RENDER: SMIL / WebGL HYBRID</text>
  <text x="1154" y="72" text-anchor="end" font-size="10" letter-spacing="1.6" fill="#8892b8">MODE: CELESTIAL SPHERE</text>

  <text x="600" y="40" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="4.5" fill="#a855f7">◈ LIVE 3D CONTRIBUTION SIMULATOR ◈</text>

  <!-- left telemetry bars -->
  <g>
    <text x="46" y="410" font-size="9" letter-spacing="1.5" fill="#8892b0">COMMIT DENSITY</text>
    <rect x="46" y="418" width="140" height="4" rx="2" fill="#1b2447"/>
    <rect x="46" y="418" width="100" height="4" rx="2" fill="#00d9ff"><animate attributeName="width" values="30;138;72;140;30" dur="9s" repeatCount="indefinite"/></rect>
    <text x="46" y="446" font-size="9" letter-spacing="1.5" fill="#8892b0">STREAK FLUX</text>
    <rect x="46" y="454" width="140" height="4" rx="2" fill="#1b2447"/>
    <rect x="46" y="454" width="110" height="4" rx="2" fill="#ff2d95"><animate attributeName="width" values="110;48;132;86;110" dur="11s" repeatCount="indefinite"/></rect>
    <text x="46" y="482" font-size="9" letter-spacing="1.5" fill="#8892b0">ORBIT STABILITY</text>
    <rect x="46" y="490" width="140" height="4" rx="2" fill="#1b2447"/>
    <rect x="46" y="490" width="130" height="4" rx="2" fill="#a855f7"><animate attributeName="width" values="126;140;118;134;126" dur="7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- right radar scope -->
  <g transform="translate(1092 452)">
    <circle r="46" fill="#060b1e" stroke="#00d9ff" stroke-width="1" opacity=".35"/>
    <circle r="31" fill="none" stroke="#00d9ff" stroke-width=".6" opacity=".22"/>
    <circle r="16" fill="none" stroke="#00d9ff" stroke-width=".6" opacity=".22"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#00d9ff" stroke-width=".6" opacity=".18"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#00d9ff" stroke-width=".6" opacity=".18"/>
    <g transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="46" y2="0" stroke="#ff2d95" stroke-width="1.6" opacity=".9"/>
      <path d="M 0,0 L 46,0 A 46,46 0 0,0 33,-33 Z" fill="#ff2d95" opacity=".18"/>
    </g>
    <circle cx="18" cy="-12" r="2.4" fill="#00d9ff" opacity=".7"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="-24" cy="9" r="2" fill="#a855f7" opacity=".7"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="-2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- CTA pill -->
  <g transform="translate(600 512)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="2.8s" repeatCount="indefinite"/>
      <rect x="-172" y="-18" width="344" height="36" rx="18" fill="#030611" opacity=".88" stroke="#00d9ff" stroke-width="1.4"/>
      <rect x="-172" y="-18" width="344" height="36" rx="18" fill="none" stroke="#a855f7" stroke-width="1.4" opacity=".5">
